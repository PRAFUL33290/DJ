<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="blur-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Large blurry powder clouds — Holi spectrum -->
  <g filter="url(#blur-xl)">
    <!-- Magenta / deep pink -->
    <circle cx="120"  cy="140"  r="160" fill="#e91e8c" opacity="0.30"/>
    <circle cx="1080" cy="660"  r="140" fill="#ff1493" opacity="0.25"/>
    <!-- Saffron / orange -->
    <circle cx="320"  cy="620"  r="130" fill="#ff6b35" opacity="0.28"/>
    <circle cx="950"  cy="180"  r="150" fill="#ff4500" opacity="0.22"/>
    <!-- Turmeric yellow -->
    <circle cx="680"  cy="710"  r="120" fill="#f7c948" opacity="0.25"/>
    <circle cx="580"  cy="80"   r="110" fill="#ffd700" opacity="0.22"/>
    <!-- Purple -->
    <circle cx="1050" cy="380"  r="120" fill="#9b59b6" opacity="0.25"/>
    <circle cx="70"   cy="520"  r="110" fill="#7b2d8b" opacity="0.22"/>
    <!-- Emerald green -->
    <circle cx="220"  cy="750"  r="100" fill="#27ae60" opacity="0.20"/>
    <!-- Sky blue -->
    <circle cx="770"  cy="60"   r="100" fill="#00bfff" opacity="0.20"/>
  </g>

  <!-- Medium powder splashes -->
  <g filter="url(#blur-lg)">
    <circle cx="400"  cy="220"  r="70" fill="#ff1493" opacity="0.35"/>
    <circle cx="860"  cy="520"  r="60" fill="#ffd700" opacity="0.35"/>
    <circle cx="200"  cy="400"  r="55" fill="#27ae60" opacity="0.30"/>
    <circle cx="1000" cy="100"  r="65" fill="#ff6b35" opacity="0.35"/>
    <circle cx="560"  cy="460"  r="55" fill="#e91e8c" opacity="0.30"/>
    <circle cx="780"  cy="320"  r="60" fill="#9b59b6" opacity="0.30"/>
    <circle cx="450"  cy="680"  r="50" fill="#00bfff" opacity="0.28"/>
    <circle cx="1100" cy="530"  r="55" fill="#ff4500" opacity="0.28"/>
  </g>

  <!-- Small sharp powder bursts -->
  <g filter="url(#blur-md)">
    <circle cx="340"  cy="380"  r="25" fill="#f7c948" opacity="0.55"/>
    <circle cx="660"  cy="240"  r="22" fill="#e91e8c" opacity="0.55"/>
    <circle cx="900"  cy="420"  r="20" fill="#ff6b35" opacity="0.55"/>
    <circle cx="500"  cy="580"  r="24" fill="#27ae60" opacity="0.50"/>
    <circle cx="140"  cy="300"  r="20" fill="#00bfff" opacity="0.50"/>
    <circle cx="1020" cy="260"  r="22" fill="#9b59b6" opacity="0.50"/>
    <circle cx="750"  cy="640"  r="20" fill="#ff1493" opacity="0.50"/>
    <circle cx="240"  cy="180"  r="18" fill="#ffd700" opacity="0.50"/>
  </g>

  <!-- Tiny powder particles scattered -->
  <g opacity="0.55">
    <circle cx="350"  cy="320"  r="7"  fill="#f7c948"/>
    <circle cx="520"  cy="190"  r="5"  fill="#e91e8c"/>
    <circle cx="720"  cy="440"  r="6"  fill="#ff6b35"/>
    <circle cx="260"  cy="540"  r="5"  fill="#00bfff"/>
    <circle cx="870"  cy="610"  r="7"  fill="#27ae60"/>
    <circle cx="1070" cy="310"  r="6"  fill="#9b59b6"/>
    <circle cx="160"  cy="650"  r="5"  fill="#ff1493"/>
    <circle cx="640"  cy="130"  r="6"  fill="#ffd700"/>
    <circle cx="460"  cy="560"  r="5"  fill="#ff6b35"/>
    <circle cx="800"  cy="90"   r="6"  fill="#e91e8c"/>
    <circle cx="980"  cy="700"  r="5"  fill="#f7c948"/>
    <circle cx="60"   cy="230"  r="6"  fill="#27ae60"/>
    <circle cx="1130" cy="450"  r="5"  fill="#ff4500"/>
    <circle cx="410"  cy="100"  r="6"  fill="#9b59b6"/>
    <circle cx="680"  cy="770"  r="5"  fill="#00bfff"/>
  </g>
</svg>
