  <line x1="43" y1="30" x2="55" y2="30" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="20" y2="20" stroke="url(#g)" stroke-width="3"   stroke-linecap="round"/>
  <line x1="40" y1="40" x2="48" y2="48" stroke="url(#g)" stroke-width="3"   stroke-linecap="round"/>
  <line x1="48" y1="12" x2="40" y2="20" stroke="url(#g)" stroke-width="3"   stroke-linecap="round"/>
