<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#e91e8c"/>
    </linearGradient>
  </defs>
  <!-- Console body -->
  <rect x="3" y="8" width="58" height="32" rx="5" stroke="url(#g)" stroke-width="2.2"/>
  <!-- Left turntable -->
  <circle cx="17" cy="24" r="10" stroke="url(#g)" stroke-width="1.8"/>
  <circle cx="17" cy="24" r="3.5" fill="url(#g)"/>
  <!-- Right turntable -->
  <circle cx="47" cy="24" r="10" stroke="url(#g)" stroke-width="1.8"/>
  <circle cx="47" cy="24" r="3.5" fill="url(#g)"/>
  <!-- Centre sliders -->
  <line x1="30" y1="13" x2="30" y2="35" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="27" y="19" width="6" height="4" rx="2" fill="url(#g)"/>
  <line x1="36" y1="13" x2="36" y2="35" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="33" y="27" width="6" height="4" rx="2" fill="url(#g)"/>
</svg>
